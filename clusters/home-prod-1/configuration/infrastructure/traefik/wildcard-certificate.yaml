# traefik serves it as its default certificate (tlsStore in the HelmRelease)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: traefik
spec:
  secretName: wildcard-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    - "*.home-prod-1.neupauer.tech"
    - "*.neupauer.tech"