apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m
  chart:
    spec:
      chart: traefik
      version: "41.6.1"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    deployment:
      replicas: 3
      lifecycle:
        preStop:
          sleep:
            seconds: 5
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-traefik
    ingressClass:
      enabled: true
      isDefaultClass: true
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    api:
      dashboard: true
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.home-prod-1.neupauer.tech`)
        entryPoints:
          - websecure
    providers:
      kubernetesIngress:
        enabled: true
      kubernetesCRD:
        enabled: true
    service:
      annotations:
        metallb.io/loadBalancerIPs: 10.0.41.101
      spec:
        type: LoadBalancer
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
