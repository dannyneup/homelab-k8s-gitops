apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 10m
  chart:
    spec:
      chart: metallb
      version: "0.16.1"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  values:
    controller:
      loglevel: info
    speaker:
      frr:
        enabled: false
    # L2 mode only, skip the frr-k8s BGP backend that is enabled by default since 0.16
    frrk8s:
      enabled: false