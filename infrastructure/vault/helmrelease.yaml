apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 10m
  chart:
    spec:
      chart: vault
      version: "0.34.1"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
  # sealed/uninitialized vault pods are never ready, without this the PDB blocks every node drain (e.g. talos upgrades)
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: PodDisruptionBudget
              name: vault
            patch: |
              - op: add
                path: /spec/unhealthyPodEvictionPolicy
                value: AlwaysAllow
  values:
    server:
      ha:
        enabled: true
        replicas: 3
        raft:
          enabled: true
      ui:
        enabled: true
      dataStorage:
        enabled: true
        size: 5Gi
    